name: Build Single-File RSDK Library

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          # We must ensure next.config.mjs has 'output: export'
          npm run build 

      - name: Flatten to Single File 📦
        run: |
          # Install a tool designed to inline Next.js exports
          npm install -g "inline-assets"
          
          # Move into the build directory
          cd out
          
          # This command finds your index.html and replaces 
          # <script src="..."> with the actual code from the file.
          inline-assets index.html ../single-dist/index.html
          
          # Copy images/assets that might not have been inlined
          cp -r assets ../single-dist/assets || true

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

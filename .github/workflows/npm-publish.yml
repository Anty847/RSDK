name: Build Single-File RSDK Library

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Static Site
        run: npx next build

      - name: Install Monolith 📦
        run: sudo apt-get update && sudo apt-get install -y monolith

      - name: Prepare and Flatten
        run: |
          # Create destination
          mkdir single-dist
          
          # FIX: Next.js often puts a leading / in the HTML even if prefix is empty.
          # We strip leading slashes from src and href so Monolith can find them locally.
          sed -i 's/src="\//src="/g' out/index.html
          sed -i 's/href="\//href="/g' out/index.html
          
          # Bundle everything into one file
          monolith ./out/index.html -o ./single-dist/index.html
          
      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

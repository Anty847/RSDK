name: Build and Deploy Single-File RSDK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Static Site
        # Use the flag directly on the next command, not in NODE_OPTIONS
        run: npx next build --no-turbo

      - name: Create Portable Single-File 📦
        run: |
          mkdir -p single-dist
          
          python3 -c '
          import os
          # Load the generated index
          with open("out/index.html", "r") as f:
              content = f.read()
          
          # 1. Base URL: Resolve all assets via jsDelivr CDN
          base_tag = "<base href=\"https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/\">"
          content = content.replace("<head>", "<head>" + base_tag)

          # 2. Router Fix: Prevents the "Black Screen of Death" hydration error
          router_fix = "<script>window.__NEXT_DATA__={props:{pageProps:{}},page:\"/\",query:{},buildId:\"prod\",nextExport:true};</script>"
          content = content.replace("</head>", router_fix + "</head>")

          # 3. Path Normalization: Strips leading slashes so <base> can work
          content = content.replace("src=\"/", "src=\"").replace("href=\"/", "href=\"")

          with open("single-dist/index.html", "w") as f:
              f.write(content)
          '

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

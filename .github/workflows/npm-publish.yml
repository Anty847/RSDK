name: Build and Deploy Single-File RSDK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Static Site
        # We disable Turbo here to ensure your custom Webpack config (fs: false) is used
        run: NODE_OPTIONS='--no-turbo' npx next build

      - name: Create Portable Single-File 📦
        run: |
          mkdir -p single-dist
          
          # Use Python to sanitize paths and inject the 'No-Black-Screen' fix
          python3 -c '
          import os
          with open("out/index.html", "r") as f:
              content = f.read()
          
          # 1. Base URL: Points to your gh-pages branch so assets work anywhere
          base_tag = "<base href=\"https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/\">"
          content = content.replace("<head>", "<head>" + base_tag)

          # 2. Router Fix: Prevents Next.js from wiping the screen to black
          router_fix = "<script>window.__NEXT_DATA__={props:{pageProps:{}},page:\"/\",query:{},buildId:\"prod\",nextExport:true};</script>"
          content = content.replace("</head>", router_fix + "</head>")

          # 3. Path Fix: Removes leading slashes that cause 404s in local files
          content = content.replace("src=\"/", "src=\"")
          content = content.replace("href=\"/", "href=\"")

          with open("single-dist/index.html", "w") as f:
              f.write(content)
          '

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

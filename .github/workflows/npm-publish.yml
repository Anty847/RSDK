name: Deploy Regular Static Site

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npx next build

      - name: Generate Local Mimic File 🛠️
        run: |
          python3 -c '
          import os, re
          
          # Read the real build to get the current hashes
          with open("out/index.html", "r") as f:
              html = f.read()
          
          # Find the actual script and style tags
          scripts = re.findall(r"<script src=\"_next/static/chunks/[^\"]+\" [^>]*></script>", html)
          styles = re.findall(r"<link rel=\"stylesheet\" href=\"_next/static/css/[^\"]+\"[^>]*>", html)
          
          # Create the portable HTML content
          cdn_url = "https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/"
          proxy_content = f"""<!DOCTYPE html><html><head><meta charset=\"utf-8\"><base href=\"{cdn_url}\"><title>RSDK Library</title>{"".join(styles)}<script>window.__NEXT_DATA__={{"props":{{"pageProps":{{}}}},"page":"/","query":{{}},"buildId":"production","nextExport":true}};</script></head><body style=\"background:#020617\"><div id=\"__next\"></div>{"".join(scripts)}</body></html>"""
          
          with open("out/rsdk_local.html", "w") as f:
              f.write(proxy_content)
          '

      - name: Deploy Everything 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages

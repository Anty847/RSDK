name: Build Single-File RSDK Library

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Static Site
        run: npx next build

      - name: Patch Index for Standalone Use
        run: |
          # 1. Inject the Base URL so it knows where to find assets on the CDN
          # This ensures images and CSS load even if the file is moved
          sed -i 's|<head>|<head><base href="https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/">|' out/index.html
          
          # 2. Fix the "Black Screen" by forcing the Next.js router to stay at root
          sed -i 's|</head>|<script>window.__NEXT_DATA__={props:{pageProps:{}},page:"/",query:{},buildId:"prod",nextExport:true};</script></head>|' out/index.html

          # 3. Strip leading slashes from ALL assets to make them relative to the base tag
          sed -i 's/src="\//src="/g' out/index.html
          sed -i 's/href="\//href="/g' out/index.html

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages

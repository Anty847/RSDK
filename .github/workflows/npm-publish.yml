name: Build Single-File RSDK Library

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Static Site
        run: npx next build

      - name: Flatten to Single File 📦
        run: |
          # Use a Node-based inliner that is easy to install
          npm install -g html-inline
          
          # Create destination
          mkdir single-dist
          
          # 1. Strip leading slashes so the inliner finds files in ./out/
          sed -i 's/src="\//src="/g' out/index.html
          sed -i 's/href="\//href="/g' out/index.html
          
          # 2. Inject the Next.js Router Fix to prevent the Black Screen
          sed -i 's|</head>|<script>window.__NEXT_DATA__={props:{pageProps:{}},page:"/",query:{},buildId:"prod",nextExport:true};</script></head>|' out/index.html
          
          # 3. Inline everything (CSS, JS) into one file
          # We run this from inside the 'out' folder so paths resolve
          cd out && html-inline index.html > ../single-dist/index.html
          
      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

name: Build Single-File RSDK Library

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Static Site
        # npx ensures the 'next' command is found even if pathing is weird
        run: npx next build

      - name: Install Monolith 📦
        run: sudo apt-get update && sudo apt-get install -y monolith

      - name: Flatten to Single File
        run: |
          # Create a directory for the single file result
          mkdir single-dist
          
          # Use monolith to bundle everything into one file.
          # We target out/index.html which was created by the build step.
          monolith ./out/index.html -o ./single-dist/index.html
          
          # Optional: Copy favicon if you want it to show in browser tabs
          cp ./out/favicon.ico ./single-dist/favicon.ico || true

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

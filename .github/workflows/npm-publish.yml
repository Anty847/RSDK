name: Build and Deploy CDN-Linked RSDK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Build
        # Standard build; Webpack is used by default if Turbo isn't requested
        run: npx next build

      - name: Patch for CDN 🌐
        run: |
          mkdir -p single-dist
          python3 -c '
          import os, re
          
          with open("out/index.html", "r") as f:
              content = f.read()
          
          # 1. Define the CDN Base
          base_url = "https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/"
          
          # 2. Inject the Base Tag and the Router Fix
          # This forces Next.js to stay on the "/" route and not go black
          head_patches = [
              f"<base href=\"{base_url}\">",
              "<script>window.__NEXT_DATA__={props:{pageProps:{}},page:\"/\",query:{},buildId:\"prod\",nextExport:true};</script>"
          ]
          content = content.replace("<head>", "<head>" + "".join(head_patches))

          # 3. Aggressive Path Cleaning
          # Replaces any src="/_next..." or href="/_next..." with relative versions
          content = content.replace("src=\"/_next", "src=\"_next")
          content = content.replace("href=\"/_next", "href=\"_next")
          content = content.replace("src=\"/assets", "src=\"assets")
          content = content.replace("href=\"/assets", "href=\"assets")

          with open("single-dist/index.html", "w") as f:
              f.write(content)
          '

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

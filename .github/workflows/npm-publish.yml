name: Build and Deploy CDN-Linked RSDK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Build
        # We use --no-turbo to ensure the Webpack 'fs' fix is applied
        run: npx next build --no-turbo

      - name: Patch for CDN 🌐
        run: |
          mkdir -p single-dist
          python3 -c '
          import os
          # Read the Next.js generated index
          with open("out/index.html", "r") as f:
              content = f.read()
          
          # 1. Inject the Base URL so it knows to look at GitHub for assets
          # This makes the file work even if opened from C:/Users/Downloads
          base_url = "https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/"
          base_tag = f"<base href=\"{base_url}\">"
          content = content.replace("<head>", "<head>" + base_tag)

          # 2. The "Black Screen" Fix
          # This tells the Next.js engine that the page is already loaded at root
          router_fix = "<script>window.__NEXT_DATA__={props:{pageProps:{}},page:\"/\",query:{},buildId:\"prod\",nextExport:true};</script>"
          content = content.replace("</head>", router_fix + "</head>")

          # 3. Path Cleaning
          # Removes the leading slash from src="/_next..." to make them relative to the <base>
          content = content.replace("src=\"/", "src=\"").replace("href=\"/", "href=\"")

          with open("single-dist/index.html", "w") as f:
              f.write(content)
          '

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages

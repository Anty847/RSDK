name: Build Single-File RSDK Library

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'


      - name: Build and Export
        run: npm run build

      - name: Flatten to Single File using Monolith 📦
        run: |
          # Install Monolith (a specialized tool for single-file bundling)
          sudo apt-get install -y monolith
          
          # Move into the output directory
          cd out
          
          # Monolith will crawl index.html and embed EVERY asset as Base64/Inline
          # -i: removes scripts (optional, but keep it off if you want JS)
          # -v: verbose output
          monolith index.html -o ../single-dist/index.html
          
      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: single-dist
          branch: gh-pages
